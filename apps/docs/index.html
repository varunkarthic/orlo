<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="orlo-route" content="<!--route-->" />
  <title><!--title--></title>
  <meta name="description" content="Orlo is a design framework for React. Nothing is an afterthought." />
  <link rel="icon" href="./favicon.ico" sizes="32x32" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
  <meta property="og:title" content="Orlo" />
  <meta property="og:description" content="Nothing is an afterthought. A design framework for React." />
  <meta property="og:image" content="./social-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <script>
    /* Resolve stored theme before first paint so there is no flash of the wrong scheme. */
    try { var t = localStorage.getItem("orlo-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.orloTheme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="root"><!--app--></div>
  <script type="module" src="/src/entry-client.tsx"></script>
</body>
</html>
